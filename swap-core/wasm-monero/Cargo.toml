[package]
name = "wasm-monero"
version = "0.1.0"
edition = "2021"
description = "Stage 5: the Monero swap leg (joint address, output scan, sweep build+sign) compiled for the browser, chain access supplied by JS fetch"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monero-side = { path = "../monero-side", default-features = false }
monero-wallet = { version = "0.2", default-features = false, features = ["std", "multisig"] }
monero-daemon-rpc = "0.2"
modular-frost = { version = "0.11", features = ["ed25519"] }
curve25519-dalek = "4"
blake2 = "0.10"
sha3 = "0.10"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
hex = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
