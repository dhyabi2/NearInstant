[package]
name = "nano-ceremony"
version = "0.1.0"
edition = "2021"
description = "Nano-side ceremony: joint account, state blocks, guard ladder (I3), PoW, saturation broadcast"

[features]
default = ["rpc"]
rpc = ["dep:ureq", "dep:serde_json"]

[dependencies]
signing = { path = "../signing" }
blake2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
rand = "0.8"
curve25519-dalek = "4"
signing = { path = "../signing" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
