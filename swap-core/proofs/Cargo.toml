[package]
name = "proofs"
version = "0.1.0"
edition = "2021"
description = "Adversarial security proofs — each protocol invariant with an attacker attempt that must fail"

[lib]
path = "src/lib.rs"

[dev-dependencies]
signing = { path = "../signing" }
nano-ceremony = { path = "../nano-ceremony" }
wasm-monero = { path = "../wasm-monero" }
monero-side = { path = "../monero-side" }
monero-wallet = { version = "0.2", default-features = false, features = ["std", "multisig"] }
curve25519-dalek = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
