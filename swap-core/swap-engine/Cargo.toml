[package]
name = "swap-engine"
version = "0.1.0"
edition = "2021"
description = "Chunked swap state machine (I1/I4): schedules, premium pricing, hostage bonds, abort discipline"

[dependencies]
signing = { path = "../signing" }
nano-ceremony = { path = "../nano-ceremony" }
monero-side = { path = "../monero-side" }

[dev-dependencies]
rand = "0.8"
hex = "0.4"
curve25519-dalek = "4"
modular-frost = { version = "0.11", features = ["ed25519"] }
monero-clsag = { version = "0.1", features = ["multisig"] }
monero-wallet = { version = "0.2", default-features = false, features = ["std", "multisig"] }
ciphersuite = { version = "0.4", features = ["std", "ed25519"] }
zeroize = "1"
dalek-ff-group = "0.5"
