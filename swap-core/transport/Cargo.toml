[package]
name = "transport"
version = "0.1.0"
edition = "2021"
description = "Two-party ceremony transport: message framing and wire-driven signing (Block 9a)"

[dependencies]
signing = { path = "../signing" }
nano-ceremony = { path = "../nano-ceremony" }
monero-side = { path = "../monero-side" }
frost-core = { version = "2", features = ["internals", "serialization"] }
modular-frost = { version = "0.11", features = ["ed25519"] }
rand_core = "0.6"
monero-clsag = { version = "0.1", features = ["multisig"] }
tungstenite = "0.24"
http = "1"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
ureq = "2"

[dev-dependencies]
rand = "0.8"
curve25519-dalek = "4"
monero-clsag = { version = "0.1", features = ["multisig"] }
monero-side = { path = "../monero-side" }
